{%- assign pn = page.parent_name -%}
<nav class="crumbs" aria-label="Fil d'Ariane">
  <ol>
    <li><a href="{{ '/' | relative_url }}">Accueil</a></li>
    {%- if page.parent_url %}<li><a href="{{ page.parent_url | relative_url }}">{{ pn }}</a></li>{% endif %}
    <li aria-current="page">{{ page.title }}</li>
  </ol>
</nav>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Accueil","item":{{ '/' | absolute_url | jsonify }}}{% if page.parent_url %},{"@type":"ListItem","position":2,"name":{{ pn | jsonify }},"item":{{ page.parent_url | absolute_url | jsonify }}},{"@type":"ListItem","position":3,"name":{{ page.title | jsonify }}}{% else %},{"@type":"ListItem","position":2,"name":{{ page.title | jsonify }}}{% endif %}]}</script>
