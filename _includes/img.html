{%- comment -%}
Paramètres : name (nom de fichier sans extension), alt, ratio (ex. 3/2), eager (true pour l'image principale), sizes
{%- endcomment -%}
{%- assign im = site.data.images[include.name] -%}
{%- assign ratio = include.ratio | default: "3/2" -%}
{%- if im -%}
<img src="{{ '/assets/img/gen/' | append: include.name | append: '-' | append: im.ws.last | append: '.webp' | relative_url }}" srcset="{% for w in im.ws %}{{ '/assets/img/gen/' | append: include.name | append: '-' | append: w | append: '.webp' | relative_url }} {{ w }}w{% unless forloop.last %}, {% endunless %}{% endfor %}" sizes="{{ include.sizes | default: '(min-width:980px) 560px, 100vw' }}" width="{{ im.w }}" height="{{ im.h }}" alt="{{ include.alt | escape }}"{% if include.eager %} fetchpriority="high" decoding="async"{% else %} loading="lazy" decoding="async"{% endif %}>
{%- else -%}
<div class="ph" role="img" aria-label="{{ include.alt | escape }}" data-img="{{ include.name }}" data-ar="{{ ratio }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m4 18 5-5 4 4 3-3 4 4"/></svg></div>
{%- endif -%}
