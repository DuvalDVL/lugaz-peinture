{%- assign items = include.items -%}
{%- if items and items.size > 0 -%}
<section class="sec" aria-labelledby="faq-t">
  <div class="wrap">
    <div class="sec-h"><p class="eyebrow">Questions fréquentes</p><h2 id="faq-t">{{ include.title | default: "Vos questions, nos réponses" }}</h2></div>
    <div class="faq prose">
      {%- for q in items %}
      <details><summary>{{ q.q }}</summary><div class="a">{{ q.a }}</div></details>
      {%- endfor %}
    </div>
  </div>
</section>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{% for q in items %}{"@type":"Question","name":{{ q.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ q.a | strip_html | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
{%- endif -%}
