<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{%- assign t = page.meta_title | default: page.title -%}
<title>{{ t }}</title>
{% if page.description %}<meta name="description" content="{{ page.description | escape }}">{% endif %}
<link rel="canonical" href="{{ page.url | replace: 'index.html', '' | absolute_url }}">
{% unless site.indexable %}<meta name="robots" content="noindex,nofollow">{% else %}{% if page.noindex %}<meta name="robots" content="noindex,follow">{% endif %}{% endunless %}
<meta property="og:locale" content="fr_FR">
<meta property="og:type" content="website">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ t | escape }}">
{% if page.description %}<meta property="og:description" content="{{ page.description | escape }}">{% endif %}
<meta property="og:url" content="{{ page.url | replace: 'index.html', '' | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/gen/og-accueil-1200.webp' | absolute_url }}">
<meta name="theme-color" content="#14181b">
<link rel="icon" href="{{ '/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="preload" href="{{ '/assets/fonts/montserrat-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/newsreader-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<style>{% include css.css %}</style>
