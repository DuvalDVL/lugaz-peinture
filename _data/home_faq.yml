- q: "Le devis est-il gratuit ?"
  a: "Oui. Nos devis sont gratuits et détaillés. Nous le remettons en général en moins d'une semaine après la visite ou l'échange sur votre projet."
- q: "Dans quelle zone intervenez-vous ?"
  a: "Principalement en Haute-Savoie autour de Copponex : Annecy, Cruseilles, Annemasse, le Genevois et le Pays de Gex. Nous intervenons aussi en Savoie et dans le canton de Genève, selon le chantier."
- q: "Combien de temps à l'avance faut-il vous contacter ?"
  a: "Pour des travaux de peinture, comptez au minimum deux mois avant le démarrage du chantier, davantage en haute saison (printemps et automne)."
- q: "Peut-on payer en plusieurs fois ?"
  a: "Oui, un paiement échelonné est possible selon l'importance du chantier. Les modalités sont indiquées sur le devis."
- q: "Vos travaux sont-ils garantis ?"
  a: "Oui, tous nos travaux bénéficient de garanties. Le détail vous est précisé sur le devis."
- q: "Utilisez-vous des matériaux respectueux de l'environnement ?"
  a: "Nous privilégions autant que possible des matériaux écologiques et peu émissifs, en fonction du support et de l'usage."
